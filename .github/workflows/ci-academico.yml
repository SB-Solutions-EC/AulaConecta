name: CI ms-academico

# Lo llama ci.yml, que luego entrega la cobertura a SonarQube.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pruebas:
    name: ms-academico
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ms-academico

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Node.js 24 (la misma versión del Dockerfile)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/ms-academico/package-lock.json

      - name: Instalar dependencias exactas (package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas y cobertura (Vitest)
        run: |
          npm run test:cov
          # Rutas relativas a la raíz del repositorio, como las espera SonarQube
          sed -i 's|^SF:src/|SF:services/ms-academico/src/|' coverage/lcov.info

      - name: Compilar
        run: npm run build

      - name: Auditar dependencias de producción (falla con HIGH o CRITICAL)
        run: npm audit --omit=dev --audit-level=high

      - name: Guardar la cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academico-resultados
          retention-days: 7
          path: services/ms-academico/coverage/lcov.info
