name: CI

on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Crea el mensaje de Telegram; los avisos siguientes lo editan con el resultado de cada etapa.
  notificar-inicio:
    name: telegram-inicio
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'synchronize' && (github.head_ref == 'dev' || github.head_ref == 'test' || github.head_ref == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mensaje-id: ${{ steps.aviso.outputs.mensaje-id }}
      inicio: ${{ steps.aviso.outputs.inicio }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Avisar en Telegram
        id: aviso
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAMA: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/notificar_telegram.sh iniciar \
            "Secretos (Gitleaks)=pendiente" \
            "ms-identidad (JUnit, JaCoCo, Dependency-Check)=pendiente" \
            "ms-academico (Vitest, npm audit)=pendiente" \
            "ms-notificaciones (pytest, pip-audit)=pendiente" \
            "Integración académico–identidad=pendiente" \
            "PWA (lint, build, Vitest)=pendiente" \
            "Cálculo de notas (Vitest, I-05)=pendiente" \
            "Imágenes (Trivy, SBOM, GHCR)=pendiente" \
            "SonarQube (quality gate)=pendiente"

  # Los trabajos que ejecutan código del PR corren en GitHub y no en el runner propio
  # (modelo de amenazas E-03). Solo SonarQube lo necesita, porque el servidor es local.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum -c -
          tar -xzf "$archivo" -C "$RUNNER_TEMP" gitleaks

      - name: Buscar secretos y datos personales en el historial
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner -v'

  identidad:
    name: identidad
    uses: ./.github/workflows/ci-identidad.yml

  academico:
    name: academico
    uses: ./.github/workflows/ci-academico.yml

  notificaciones:
    name: notificaciones
    uses: ./.github/workflows/ci-notificaciones.yml

  web:
    name: web
    uses: ./.github/workflows/ci-web.yml

  # Paquete compartido de cálculo de notas: hoja oficial anonimizada e indicador I-05 (T1117-A)
  calculo:
    name: calculo
    uses: ./.github/workflows/ci-calculo.yml

  # ms-academico pide su token de servicio a un ms-identidad real y crea una cuenta con él (T1110-A)
  integracion:
    name: integracion
    needs: [identidad, academico]
    uses: ./.github/workflows/ci-integracion.yml

  imagen-identidad:
    name: imagen-identidad
    needs: [gitleaks, identidad]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-imagen.yml
    with:
      servicio: ms-identidad
      contexto: services/ms-identidad
      publicar: ${{ github.event_name == 'push' }}

  imagen-academico:
    name: imagen-academico
    needs: [gitleaks, academico]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-imagen.yml
    with:
      servicio: ms-academico
      contexto: services/ms-academico
      publicar: ${{ github.event_name == 'push' }}

  imagen-notificaciones:
    name: imagen-notificaciones
    needs: [gitleaks, notificaciones]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-imagen.yml
    with:
      servicio: ms-notificaciones
      contexto: services/ms-notificaciones
      publicar: ${{ github.event_name == 'push' }}

  imagen-pwa:
    name: imagen-pwa
    needs: [gitleaks, web, calculo]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-imagen.yml
    with:
      servicio: pwa
      contexto: apps/pwa
      contextos-adicionales: calculo-notas=packages/calculo-notas
      publicar: ${{ github.event_name == 'push' }}

  # Despliegue continuo al ambiente de pruebas (T1116-A): solo en push a test, con las imágenes que
  # este mismo CI acaba de escanear y publicar. Después corre la prueba e2e de login contra el ambiente.
  # No espera a quality-pr: ese check ya se exigió en el PR hacia test y su runner puede estar apagado.
  desplegar-pruebas:
    name: desplegar-pruebas
    needs: [integracion, imagen-identidad, imagen-academico, imagen-notificaciones, imagen-pwa]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/test' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd-pruebas.yml
    secrets: inherit

  notificar-pruebas:
    name: telegram-pruebas
    needs: [notificar-inicio, gitleaks, identidad, academico, notificaciones, integracion, web, calculo,
            imagen-identidad, imagen-academico, imagen-notificaciones, imagen-pwa]
    if: ${{ !cancelled() && needs.notificar-inicio.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Avisar en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAMA: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MENSAJE_ID: ${{ needs.notificar-inicio.outputs.mensaje-id }}
          INICIO: ${{ needs.notificar-inicio.outputs.inicio }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          IDENTIDAD: ${{ needs.identidad.result }}
          ACADEMICO: ${{ needs.academico.result }}
          NOTIFICACIONES: ${{ needs.notificaciones.result }}
          INTEGRACION: ${{ needs.integracion.result }}
          WEB: ${{ needs.web.result }}
          CALCULO: ${{ needs.calculo.result }}
          IMAGENES: >-
            ${{ needs.imagen-identidad.result }} ${{ needs.imagen-academico.result }}
            ${{ needs.imagen-notificaciones.result }} ${{ needs.imagen-pwa.result }}
        run: |
          # Las cuatro imágenes se muestran juntas: un fallo manda sobre una omisión, y esta sobre el éxito
          imagenes=success
          for r in $IMAGENES; do
            case "$r" in
              failure | cancelled) imagenes=failure ;;
              skipped) [ "$imagenes" = success ] && imagenes=skipped ;;
            esac
          done
          bash .github/scripts/notificar_telegram.sh actualizar \
            "Secretos (Gitleaks)=$GITLEAKS" \
            "ms-identidad (JUnit, JaCoCo, Dependency-Check)=$IDENTIDAD" \
            "ms-academico (Vitest, npm audit)=$ACADEMICO" \
            "ms-notificaciones (pytest, pip-audit)=$NOTIFICACIONES" \
            "Integración académico–identidad=$INTEGRACION" \
            "PWA (lint, build, Vitest)=$WEB" \
            "Cálculo de notas (Vitest, I-05)=$CALCULO" \
            "Imágenes (Trivy, SBOM, GHCR)=$imagenes" \
            "SonarQube (quality gate)=pendiente"

  quality:
    name: quality-pr
    needs: [gitleaks, identidad, academico, notificaciones, integracion, web, calculo,
            imagen-identidad, imagen-academico, imagen-notificaciones, imagen-pwa]
    # Corre aunque falle una etapa previa: un job omitido cuenta como exitoso en los checks requeridos.
    # Los PR desde forks no llegan al runner propio.
    if: ${{ !cancelled() && (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) }}
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30

    steps:
      - name: Verificar etapas previas
        shell: powershell
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          $fallidas = @(
            ($env:RESULTADOS | ConvertFrom-Json).PSObject.Properties |
              Where-Object { $_.Value.result -ne "success" } |
              ForEach-Object { "$($_.Name)=$($_.Value.result)" }
          )
          if ($fallidas.Count -gt 0) {
            throw "Etapas previas sin aprobar: $($fallidas -join ', ')"
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate repository JSON
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Web.Extensions
          $serializer = New-Object System.Web.Script.Serialization.JavaScriptSerializer
          $serializer.MaxJsonLength = [int]::MaxValue
          $files = Get-ChildItem -Path . -Filter *.json -File -Recurse
          foreach ($file in $files) {
            $null = $serializer.DeserializeObject((Get-Content -Raw -Encoding UTF8 $file.FullName))
            Write-Output "Valid JSON: $($file.FullName)"
          }

      - name: Check required project files
        shell: powershell
        run: |
          $files = @(
            "README.md",
            "SECURITY.md",
            ".github/CODEOWNERS",
            ".github/pull_request_template.md"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required file not found: $file"
            }
          }

      - name: Check required secrets
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $required = @(
            "SONAR_TOKEN",
            "SONAR_PROJECT_KEY",
            "SONAR_HOST_URL"
          )
          $missing = @(
            $required | Where-Object {
              [string]::IsNullOrWhiteSpace((Get-Item "Env:$_").Value)
            }
          )
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Secrets: $($missing -join ', ')"
          }

      - name: Descargar clases y cobertura de ms-identidad
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: identidad-resultados
          path: services/ms-identidad/target

      # El artefacto trae coverage/lcov.info y reportes/: se descarga en la carpeta del servicio
      - name: Descargar cobertura de ms-academico
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: academico-resultados
          path: services/ms-academico

      - name: Descargar cobertura de ms-notificaciones
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notificaciones-resultados
          path: services/ms-notificaciones

      - name: Descargar cobertura de la PWA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-resultados
          path: apps/pwa

      # El artefacto trae coverage/lcov.info y reportes/: se descarga en la carpeta del paquete
      - name: Descargar cobertura del cálculo de notas
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calculo-resultados
          path: packages/calculo-notas

      # Sin un reporte, SonarQube cuenta ese servicio con 0 % de cobertura y el quality gate falla sin decir por qué
      - name: Verificar los reportes de cobertura
        shell: powershell
        run: |
          $reportes = @(
            "services/ms-identidad/target/site/jacoco/jacoco.xml",
            "services/ms-academico/coverage/lcov.info",
            "services/ms-notificaciones/coverage.xml",
            "apps/pwa/coverage/lcov.info",
            "packages/calculo-notas/coverage/lcov.info"
          )
          $faltan = @($reportes | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($faltan.Count -gt 0) {
            throw "Faltan reportes de cobertura: $($faltan -join ', ')"
          }
          $reportes | ForEach-Object { Write-Output "OK $_ ($((Get-Item -LiteralPath $_).Length) bytes)" }

      - name: SonarQube analysis
        shell: powershell
        env:
          # El scanner los lee del entorno: como argumentos serían visibles en la lista de procesos
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          $scanner = "C:\sonar-scanner\bin\sonar-scanner.bat"
          if (-not (Test-Path -LiteralPath $scanner -PathType Leaf)) {
            throw "SonarScanner no encontrado en $scanner. Instálalo en el runner autoalojado."
          }
          & $scanner `
            "-Dsonar.projectKey=$env:SONAR_PROJECT_KEY" `
            "-Dsonar.qualitygate.wait=true"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # El servidor de SonarQube solo es accesible desde el runner: deja en el log qué condición falló
      # y los problemas nuevos con su archivo y línea, para corregirlos sin entrar al servidor
      - name: Condiciones del quality gate y problemas nuevos
        if: ${{ failure() }}
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          $servidor = $env:SONAR_HOST_URL.TrimEnd('/')
          $proyecto = [uri]::EscapeDataString($env:SONAR_PROJECT_KEY)
          $cabeceras = @{ Authorization = "Bearer $env:SONAR_TOKEN" }

          $estado = Invoke-RestMethod -Uri "$servidor/api/qualitygates/project_status?projectKey=$proyecto" -Headers $cabeceras
          $estado.projectStatus.conditions |
            Select-Object status, metricKey, comparator, errorThreshold, actualValue |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Output

          $nuevos = Invoke-RestMethod -Uri "$servidor/api/issues/search?componentKeys=$proyecto&inNewCodePeriod=true&resolved=false&ps=100" -Headers $cabeceras
          Write-Output "Problemas nuevos sin resolver: $($nuevos.total)"

          # Además del log: tabla en el resumen de la ejecución y anotación en la línea del archivo (pestaña Files changed del PR)
          $resumen = @(
            "## SonarQube: el quality gate falló",
            "",
            "| Estado | Métrica | Umbral | Valor |",
            "|---|---|---|---|"
          )
          foreach ($condicion in $estado.projectStatus.conditions) {
            $resumen += "| $($condicion.status) | $($condicion.metricKey) | $($condicion.comparator) $($condicion.errorThreshold) | $($condicion.actualValue) |"
          }
          $resumen += @("", "### Problemas nuevos sin resolver: $($nuevos.total)", "", "| Gravedad | Archivo | Regla | Mensaje |", "|---|---|---|---|")
          foreach ($problema in $nuevos.issues) {
            $archivo = $problema.component -replace '^[^:]*:', ''
            $mensaje = $problema.message -replace '\|', '\|'
            Write-Output "- [$($problema.severity)] $archivo`:$($problema.line) $($problema.rule): $($problema.message)"
            Write-Output "::error file=$archivo,line=$($problema.line),title=SonarQube $($problema.rule)::$($problema.message)"
            $resumen += "| $($problema.severity) | ``$archivo`:$($problema.line)`` | $($problema.rule) | $mensaje |"
          }
          # UTF-8 sin BOM: Out-File de PowerShell 5 agrega un BOM que rompe el título del resumen
          [System.IO.File]::AppendAllLines($env:GITHUB_STEP_SUMMARY, [string[]]$resumen, (New-Object System.Text.UTF8Encoding($false)))

  notificar-calidad:
    name: telegram-calidad
    needs: [notificar-inicio, gitleaks, identidad, academico, notificaciones, integracion, web, calculo,
            imagen-identidad, imagen-academico, imagen-notificaciones, imagen-pwa, notificar-pruebas, quality]
    if: ${{ !cancelled() && needs.quality.result != 'skipped' && needs.notificar-inicio.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Avisar en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAMA: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MENSAJE_ID: ${{ needs.notificar-inicio.outputs.mensaje-id }}
          INICIO: ${{ needs.notificar-inicio.outputs.inicio }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          IDENTIDAD: ${{ needs.identidad.result }}
          ACADEMICO: ${{ needs.academico.result }}
          NOTIFICACIONES: ${{ needs.notificaciones.result }}
          INTEGRACION: ${{ needs.integracion.result }}
          WEB: ${{ needs.web.result }}
          CALCULO: ${{ needs.calculo.result }}
          IMAGENES: >-
            ${{ needs.imagen-identidad.result }} ${{ needs.imagen-academico.result }}
            ${{ needs.imagen-notificaciones.result }} ${{ needs.imagen-pwa.result }}
          CALIDAD: ${{ needs.quality.result }}
        run: |
          # Las cuatro imágenes se muestran juntas: un fallo manda sobre una omisión, y esta sobre el éxito
          imagenes=success
          for r in $IMAGENES; do
            case "$r" in
              failure | cancelled) imagenes=failure ;;
              skipped) [ "$imagenes" = success ] && imagenes=skipped ;;
            esac
          done
          bash .github/scripts/notificar_telegram.sh actualizar \
            "Secretos (Gitleaks)=$GITLEAKS" \
            "ms-identidad (JUnit, JaCoCo, Dependency-Check)=$IDENTIDAD" \
            "ms-academico (Vitest, npm audit)=$ACADEMICO" \
            "ms-notificaciones (pytest, pip-audit)=$NOTIFICACIONES" \
            "Integración académico–identidad=$INTEGRACION" \
            "PWA (lint, build, Vitest)=$WEB" \
            "Cálculo de notas (Vitest, I-05)=$CALCULO" \
            "Imágenes (Trivy, SBOM, GHCR)=$imagenes" \
            "SonarQube (quality gate)=$CALIDAD"
