name: CI

on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality-pr
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository JSON
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Filter *.json -File -Recurse
          foreach ($file in $files) {
            Get-Content -Raw $file.FullName | ConvertFrom-Json | Out-Null
            Write-Output "Valid JSON: $($file.FullName)"
          }

      - name: Check required project files
        shell: powershell
        run: |
          $files = @(
            "README.md",
            "SECURITY.md",
            ".github/CODEOWNERS",
            ".github/pull_request_template.md"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required file not found: $file"
            }
          }

      - name: Check required secrets
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $required = @(
            "SONAR_TOKEN",
            "SONAR_PROJECT_KEY",
            "SONAR_HOST_URL",
            "TELEGRAM_BOT_TOKEN",
            "TELEGRAM_CHAT_ID"
          )
          $missing = @(
            $required | Where-Object {
              [string]::IsNullOrWhiteSpace((Get-Item "Env:$_").Value)
            }
          )
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Secrets: $($missing -join ', ')"
          }

      - name: SonarQube analysis
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $scanner = "C:\sonar-scanner\bin\sonar-scanner.bat"
          if (-not (Test-Path -LiteralPath $scanner -PathType Leaf)) {
            throw "SonarScanner no encontrado en $scanner. Instálalo en el runner autoalojado."
          }
          & $scanner `
            "-Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}" `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=true"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $message = "AulaConecta CI: $env:JOB_STATUS`nBranch: $env:BRANCH_NAME`nCommit: $env:COMMIT_SHA"
          $payload = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
          } | ConvertTo-Json -Compress
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
          $uri = "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage"
          try {
            $response = Invoke-WebRequest `
              -Method Post `
              -Uri $uri `
              -Body $bytes `
              -ContentType "application/json; charset=utf-8" `
              -UseBasicParsing
            $result = $response.Content | ConvertFrom-Json
            if (-not $result.ok) {
              throw "Telegram API rejected the message: $($response.Content)"
            }
            Write-Output "Telegram notification sent."
          } catch {
            Write-Warning "Telegram notification failed: $($_.Exception.Message)"
          }
