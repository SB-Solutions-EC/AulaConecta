name: CI

on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Crea el mensaje de Telegram; los avisos siguientes lo editan con el resultado de cada etapa.
  notificar-inicio:
    name: telegram-inicio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mensaje-id: ${{ steps.aviso.outputs.mensaje-id }}
      inicio: ${{ steps.aviso.outputs.inicio }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Avisar en Telegram
        id: aviso
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAMA: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/notificar_telegram.sh iniciar \
            "Secretos (Gitleaks)=pendiente" \
            "ms-identidad (JUnit, JaCoCo, Dependency-Check)=pendiente" \
            "Imagen ms-identidad (Trivy, SBOM, GHCR)=pendiente" \
            "SonarQube (quality gate)=pendiente"

  # Los trabajos que ejecutan código del PR corren en GitHub y no en el runner propio
  # (modelo de amenazas E-03). Solo SonarQube lo necesita, porque el servidor es local.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum -c -
          tar -xzf "$archivo" -C "$RUNNER_TEMP" gitleaks

      - name: Buscar secretos y datos personales en el historial
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner -v'

  identidad:
    name: identidad
    uses: ./.github/workflows/ci-identidad.yml

  imagen-identidad:
    name: imagen-identidad
    needs: [gitleaks, identidad]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-imagen.yml
    with:
      servicio: ms-identidad
      contexto: services/ms-identidad
      publicar: ${{ github.event_name == 'push' }}

  notificar-pruebas:
    name: telegram-pruebas
    needs: [notificar-inicio, gitleaks, identidad, imagen-identidad]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Avisar en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAMA: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MENSAJE_ID: ${{ needs.notificar-inicio.outputs.mensaje-id }}
          INICIO: ${{ needs.notificar-inicio.outputs.inicio }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          IDENTIDAD: ${{ needs.identidad.result }}
          IMAGEN: ${{ needs.imagen-identidad.result }}
        run: |
          bash .github/scripts/notificar_telegram.sh actualizar \
            "Secretos (Gitleaks)=$GITLEAKS" \
            "ms-identidad (JUnit, JaCoCo, Dependency-Check)=$IDENTIDAD" \
            "Imagen ms-identidad (Trivy, SBOM, GHCR)=$IMAGEN" \
            "SonarQube (quality gate)=pendiente"

  quality:
    name: quality-pr
    needs: [gitleaks, identidad, imagen-identidad]
    # Corre aunque falle una etapa previa: un job omitido cuenta como exitoso en los checks requeridos.
    # Los PR desde forks no llegan al runner propio.
    if: ${{ !cancelled() && (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) }}
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30

    steps:
      - name: Verificar etapas previas
        shell: powershell
        env:
          GITLEAKS: ${{ needs.gitleaks.result }}
          IDENTIDAD: ${{ needs.identidad.result }}
          IMAGEN: ${{ needs.imagen-identidad.result }}
        run: |
          if ($env:GITLEAKS -ne "success" -or $env:IDENTIDAD -ne "success" -or $env:IMAGEN -ne "success") {
            throw "Etapas previas sin aprobar: gitleaks=$env:GITLEAKS, identidad=$env:IDENTIDAD, imagen=$env:IMAGEN"
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate repository JSON
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Filter *.json -File -Recurse
          foreach ($file in $files) {
            Get-Content -Raw $file.FullName | ConvertFrom-Json | Out-Null
            Write-Output "Valid JSON: $($file.FullName)"
          }

      - name: Check required project files
        shell: powershell
        run: |
          $files = @(
            "README.md",
            "SECURITY.md",
            ".github/CODEOWNERS",
            ".github/pull_request_template.md"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required file not found: $file"
            }
          }

      - name: Check required secrets
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $required = @(
            "SONAR_TOKEN",
            "SONAR_PROJECT_KEY",
            "SONAR_HOST_URL"
          )
          $missing = @(
            $required | Where-Object {
              [string]::IsNullOrWhiteSpace((Get-Item "Env:$_").Value)
            }
          )
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Secrets: $($missing -join ', ')"
          }

      - name: Descargar clases y cobertura de ms-identidad
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: identidad-resultados
          path: services/ms-identidad/target

      - name: SonarQube analysis
        shell: powershell
        env:
          # El scanner los lee del entorno: como argumentos serían visibles en la lista de procesos
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          $scanner = "C:\sonar-scanner\bin\sonar-scanner.bat"
          if (-not (Test-Path -LiteralPath $scanner -PathType Leaf)) {
            throw "SonarScanner no encontrado en $scanner. Instálalo en el runner autoalojado."
          }
          & $scanner `
            "-Dsonar.projectKey=$env:SONAR_PROJECT_KEY" `
            "-Dsonar.qualitygate.wait=true"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  notificar-calidad:
    name: telegram-calidad
    needs: [notificar-inicio, gitleaks, identidad, imagen-identidad, notificar-pruebas, quality]
    if: ${{ !cancelled() && needs.quality.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Avisar en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAMA: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MENSAJE_ID: ${{ needs.notificar-inicio.outputs.mensaje-id }}
          INICIO: ${{ needs.notificar-inicio.outputs.inicio }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          IDENTIDAD: ${{ needs.identidad.result }}
          IMAGEN: ${{ needs.imagen-identidad.result }}
          CALIDAD: ${{ needs.quality.result }}
        run: |
          bash .github/scripts/notificar_telegram.sh actualizar \
            "Secretos (Gitleaks)=$GITLEAKS" \
            "ms-identidad (JUnit, JaCoCo, Dependency-Check)=$IDENTIDAD" \
            "Imagen ms-identidad (Trivy, SBOM, GHCR)=$IMAGEN" \
            "SonarQube (quality gate)=$CALIDAD"
