        asignacionId:
          type: string
          format: uuid
        trimestre:
          type: integer
        promedioCurso:
          type: number
        conRefuerzo:
          type: integer
        aprobados:
          type: integer
        enRiesgo:
          type: integer

    TableroInstitucional:
      type: object
      required: [totalEstudiantes, promedioGeneral, porcentajeAsistencia, planificacionesPendientes, cursos]
      properties:
        totalEstudiantes:
          type: integer
        promedioGeneral:
          type: number
        porcentajeAsistencia:
          type: number
        planificacionesPendientes:
          type: integer
        cursos:
          type: array
          items:
            type: object
            required: [cursoId, nombre, promedio, enRiesgo]
            properties:
              cursoId:
                type: string
                format: uuid
              nombre:
                type: string
              promedio:
                type: number
              enRiesgo:
                type: integer

    TableroEstudiante:
      type: object
      required: [estudianteId, promedioGeneral, porcentajeAsistencia, alertasPromedioBajo, calificaciones, horario]
      properties:
        estudianteId:
          type: string
          format: uuid
        promedioGeneral:
          type: number
        porcentajeAsistencia:
          type: number
        alertasPromedioBajo:
          type: array
          description: Materias con nota menor a 7.00 (RF-28)
          items:
            type: object
            required: [materia, notaFinal]
            properties:
              materia:
                type: string
              notaFinal:
                type: number
        calificaciones:
          type: array
          items:
            $ref: "#/components/schemas/Calificacion"
        horario:
          type: array
          items:
            $ref: "#/components/schemas/BloqueHorario"

    Parametro:
      type: object
      required: [id, clave, valor, version]
      properties:
        id:
          type: string
          format: uuid
        clave:
          type: string
          example: ponderacion_aportes
        valor:
          type: object
          additionalProperties: true
        version:
          type: integer

    SolicitudParametro:
      type: object
      required: [clave, valor, version]
      properties:
        clave:
          type: string
        valor:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 0

    RegistroAuditoriaAcademica:
      type: object
      required: [id, entidad, entidadId, accion, usuarioId, ocurridoEn]
      properties:
        id:
          type: string
          format: uuid
        entidad:
          type: string
          example: CALIFICACION
        entidadId:
          type: string
          format: uuid
        accion:
          type: string
          enum: [CREATE, UPDATE, DELETE_LOGICAL]
        valorAnterior:
          type: [object, "null"]
          additionalProperties: true
        valorNuevo:
          type: [object, "null"]
          additionalProperties: true
        usuarioId:
          type: string
          format: uuid
        ocurridoEn:
          type: string
          format: date-time

    CambioPull:
      type: object
      required: [entity, entityId, operation, serverVersion, serverUpdatedAt, data]
      properties:
        entity:
          type: string
          enum: [curso, materia, asignacion, matricula, planificacion, calificacion, tarea, entrega, asistencia, comportamiento]
        entityId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [CREATE, UPDATE, DELETE_LOGICAL]
        serverVersion:
          type: integer
        serverUpdatedAt:
          type: string
          format: date-time
        serverUpdatedBy:
          type: [string, "null"]
          format: uuid
        data:
          type: object
          additionalProperties: true

    RespuestaSyncPull:
      type: object
      required: [changes, nextCursor, schemaVersion]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/CambioPull"
        nextCursor:
          type: string
        schemaVersion:
          type: integer
          example: 1

    OperacionSyncPush:
      type: object
      required: [operationId, entity, entityId, operation, baseVersion, changedFields, payload]
      properties:
        operationId:
          type: string
          format: uuid
        entity:
          type: string
          enum: [asistencia, calificacion, planificacion, tarea, entrega, comportamiento]
        entityId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [CREATE, UPDATE, DELETE_LOGICAL]
        baseVersion:
          type: integer
          minimum: 0
        changedFields:
          type: array
          items:
            type: string
        payload:
          type: object
          additionalProperties: true

    SolicitudSyncPush:
      type: object
      required: [operations]
      properties:
        deviceId:
          type: string
          format: uuid
        operations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/OperacionSyncPush"

    ResultadoOperacionSync:
      type: object
      required: [operationId, status, entityId]
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [SYNCED, CONFLICT, FAILED]
        entityId:
          type: string
          format: uuid
        serverVersion:
          type: [integer, "null"]
        conflict:
          $ref: "#/components/schemas/ConflictoSincronizacion"

    RespuestaSyncPush:
      type: object
      required: [results, nextCursor]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ResultadoOperacionSync"
        nextCursor:
          type: string

    ConflictoSincronizacion:
      type: object
      required:
        - status
        - entityId
        - baseVersion
        - serverVersion
        - serverData
        - serverUpdatedBy
        - serverUpdatedAt
        - conflictingFields
      properties:
        status:
          type: string
          enum: [CONFLICT]
        entityId:
          type: string
          format: uuid
        baseVersion:
          type: integer
        serverVersion:
          type: integer
        serverData:
          type: object
          additionalProperties: true
        serverUpdatedBy:
          type: string
          format: uuid
        serverUpdatedAt:
          type: string
          format: date-time
        conflictingFields:
          type: array
          items:
            type: string

    ErrorApi:
      type: object
      required: [codigo, mensaje, timestamp]
      properties:
        codigo:
          type: string
          example: ACCESO_DENEGADO
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

