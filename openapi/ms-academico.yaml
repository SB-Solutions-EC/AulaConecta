          format: uuid
        anioLectivoId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        motivo:
          type: string
        version:
          type: integer

    SolicitudDiaNoDictado:
      type: object
      required: [fecha, motivo]
