<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Educativo — Unidad Educativa "Andoas"</title>
<link rel="icon" href="assets/logo-andoas.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Quicksand', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
        },
        colors: {
          primary: { DEFAULT: '#1e3a5f', dark: '#16304d', light: '#2c5282' },
          accent:  { DEFAULT: '#e8833a', dark: '#c25e17', light: '#fdece0' },
          sky:     { DEFAULT: '#2f8fd1', light: '#eaf4fc' },
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

<div id="app" class="flex h-screen w-full overflow-hidden">
  <div id="sidebar-backdrop" onclick="window.toggleSidebar(false)" class="hidden fixed inset-0 bg-slate-900/40 z-30 lg:hidden"></div>
  <aside id="sidebar"></aside>
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header id="topbar"></header>
    <main id="view-root" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 items-end max-w-[90vw]"></div>
<div id="printArea"></div>

<script src="script.js?v=3"></script>
</body>
</html>
