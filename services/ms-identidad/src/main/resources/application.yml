spring:
  application:
    name: ms-identidad

aulaconecta:
  jwt:
    # Archivo PEM (PKCS#8) montado como secreto; en local lo genera infra/identidad/generar_clave_jwt.sh
    clave-privada: ${AULACONECTA_JWT_CLAVE_PRIVADA}
    emisor: aulaconecta-identidad
    audiencia: aulaconecta
    duracion-acceso: 15m
  # Tras 3 intentos fallidos seguidos la cuenta se bloquea 15 minutos (taller de riesgos)
  bloqueo:
    intentos-maximos: 3
    duracion: 15m

server:
  port: 8080
  shutdown: graceful
  # La IP del cliente la pone el gateway; solo se confía en proxies de redes privadas (la red interna)
  forward-headers-strategy: native

# Solo se expone /health, sin detalles internos: el gateway lo publica en /api/identidad/health.
management:
  endpoints:
    web:
      base-path: /
      discovery:
        enabled: false
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
