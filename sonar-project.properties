# Configuración del análisis de SonarQube.
# La clave del proyecto, la URL del servidor y el token los pasa el CI (.github/workflows/ci.yml).

sonar.projectName=AulaConecta
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Fuera del análisis de calidad (Gitleaks sí los revisa en busca de secretos):
#  - prototipo/: demo HTML + JS validada con el cliente. No se despliega; la PWA se construye
#    de nuevo en frontend/ (React + Vite) y esa sí se analiza con el quality gate.
#  - scripts/: herramientas del equipo para GitHub (backlog y tareas). Se ejecutan a mano con las
#    credenciales de cada integrante y no forman parte de la plataforma.
sonar.exclusions=prototipo/**,scripts/**,**/__pycache__/**
