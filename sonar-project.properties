# Configuración del análisis de SonarQube.
# La clave del proyecto, la URL del servidor y el token los pasa el CI (.github/workflows/ci.yml).

sonar.projectName=AulaConecta
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Las pruebas no son código a cubrir: sin esto, SonarQube las cuenta como código de producción.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/tests/**,**/*.test.ts,**/*.test.tsx,**/setupTests.ts
sonar.test.exclusions=services/ms-notificaciones/tests/**

# Reportes por servicio: el CI los genera antes del análisis. ms-academico, ms-notificaciones y la PWA
# agregan aquí los suyos (T1029-M y T1029-C).
sonar.java.binaries=services/ms-identidad/target/classes
sonar.java.test.binaries=services/ms-identidad/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=services/ms-identidad/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=services/ms-identidad/target/surefire-reports
sonar.javascript.lcov.reportPaths=apps/pwa/coverage/lcov.info

# Fuera del análisis de calidad (Gitleaks sí los revisa en busca de secretos):
#  - prototipo/: demo HTML + JS validada con el cliente. No se despliega; la PWA se construye
#    de nuevo en apps/pwa/ (React + Vite) y esa sí se analiza con el quality gate.
#  - scripts/: herramientas del equipo para GitHub (backlog y tareas). Se ejecutan a mano con las
#    credenciales de cada integrante y no forman parte de la plataforma.
sonar.exclusions=prototipo/**,scripts/**,**/alembic/**,**/__pycache__/**,**/node_modules/**,**/dist/**,**/coverage/**,**/src/test/**,**/tests/**,**/*.test.ts,**/*.test.tsx,**/setupTests.ts,apps/pwa/src/main.tsx,apps/pwa/src/index.css,apps/pwa/*.config.*,services/ms-academico/src/**,services/ms-notificaciones/app/**
sonar.coverage.exclusions=apps/pwa/src/main.tsx,apps/pwa/*.config.*,services/ms-academico/**,services/ms-notificaciones/**
